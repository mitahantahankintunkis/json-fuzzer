# Payloads to fuzz
# [[payloads]]
# name = "duplicate_keys"
# payload = '{"q":2,"q":3}'
# datatype = "Int"
# key = "q"
# all_basic_tests = true

# Base case
[[payloads]]
name = "valid-no-fuzz"
payload = '{"q":42}'


# Simple insertion
[[payloads]]
name = "duplicate_keys_insert_single_byte"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]

[[payloads]]
name = "duplicate_keys_insert_two_bytes"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
id = '0'
[[payloads.fuzz]]
right_of = '0'


# Simple replace
[[payloads]]
name = "duplicate_keys_replace_single_byte"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
remove_after = 1

[[payloads]]
name = "duplicate_keys_replace_two_bytes"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
remove_after = 1
id = '0'
[[payloads.fuzz]]
remove_after = 1
right_of = '0'


