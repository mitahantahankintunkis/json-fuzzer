prefix = '%'

[[payloads]]
name = "duplicate_keys_insert_two_url"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
map = { Characters = { chars = '0123456789abcdef', byte_count = 2 }}
prefix = '%'
id = '0'
[[payloads.fuzz]]
map = { Characters = { chars = '0123456789abcdef', byte_count = 2 }}
prefix = '%'
right_of = '0'

[[payloads]]
name = "duplicate_keys_replace_url"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
