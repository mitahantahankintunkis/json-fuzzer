# Unicode string enconding
[[payloads]]
name = "duplicate_keys_insert_unicode"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
map = { Characters = { chars = '0123456789abcdef', byte_count = 4 }}
prefix = '\u'
#fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
#bytes = 4

[[payloads]]
name = "duplicate_keys_replace_unicode"
payload = '{"q":2,"q":3}'
[[payloads.fuzz]]
map = { Characters = { chars = '0123456789abcdef', byte_count = 4 }}
prefix = '\u'
remove_after = 1
#fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
#bytes = 4

