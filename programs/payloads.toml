# bytes = 4


# Unicode string enconding
[[payloads]]
name = "duplicate_keys_insert_unicode"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
prefix = '\u'
bytes = 4

[[payloads]]
name = "duplicate_keys_replace_unicode"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
prefix = '\u'
bytes = 4

[[payloads]]
name = "duplicate_keys_replace_key0_unicode"
payload = '{"@.....":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
fuzz_mode = { ReplaceCharacters = '@' }
prefix = '\u'
bytes = 4

[[payloads]]
name = "duplicate_keys_replace_key1_unicode"
payload = '{"q":2,"@.....":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_range = { Characters = {chars = '0123456789abcdef', length = 4}}
fuzz_mode = { ReplaceCharacters = '@' }
prefix = '\u'
bytes = 4

