[package]
name = "json-fuzzer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
md5 = "0.7.0"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.9.5"

[profile.release]
debug = 1
#debug = "line-tables-only"

[profile.test]
inherits = "release"
