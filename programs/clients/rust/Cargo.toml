[package]
name = "rust-client"
version = "0.1.0"
edition = "2021"

[dependencies]
jiter = "0.8.2"
json = "0.12.4"
jsonc-parser = { version = "0.31.0", features = [] }
postgres = { version = "0.19.12", features = ["with-serde_json-1"] }
rusqlite = "0.37.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
