# Payloads to fuzz

# Base case
[[payloads]]
name = "valid-no-fuzz"
payload = '{"q":42}'
datatype = "Int"
key = "q"


# Simple insertion
[[payloads]]
name = "duplicate_keys_insert_single_byte"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]

[[payloads]]
name = "duplicate_keys_insert_two_bytes"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
[[payloads.fuzz]]


# Simple replace
[[payloads]]
name = "duplicate_keys_replace_single_byte"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_mode = "ReplaceAllPossible"

[[payloads]]
name = "duplicate_keys_replace_two_bytes"
payload = '{"q":2,"q":3}'
datatype = "Int"
key = "q"
[[payloads.fuzz]]
fuzz_mode = "ReplaceAllPossible"
[[payloads.fuzz]]
fuzz_mode = "ReplaceAllPossible"


